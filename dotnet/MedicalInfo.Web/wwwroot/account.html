<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>회원 계정 · Dr.Geo</title><link rel="stylesheet" href="/site.css"><script src="/account.js" defer></script></head>
<body><main><nav><a href="/">병원·약국 찾기</a><a href="/inquiries.html">문의·답변</a></nav><h1>회원 계정</h1>
<p id="account-status" role="status" aria-live="polite"></p>
<section id="anonymous">
<h2>로그인</h2><form id="login">
<label>아이디<input name="username" autocomplete="username" required maxlength="40"></label>
<label>비밀번호<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label>
<button>로그인</button></form>
<h2>회원가입</h2><form id="register">
<label>새 아이디<input name="username" autocomplete="username" required minlength="3" maxlength="40" pattern="[a-zA-Z0-9._\-]+"></label>
<label>표시 이름<input name="displayName" autocomplete="nickname" required maxlength="50"></label>
<label>이메일<input name="email" type="email" autocomplete="email" required maxlength="254"></label>
<label>새 비밀번호 (12~128자)<input name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="128"></label>
<label>비밀번호 확인<input name="confirmation" type="password" autocomplete="new-password" required minlength="12" maxlength="128"></label>
<button>가입하기</button></form>
<p>이메일 인증·계정 복구와 소셜 로그인은 아직 이전 중입니다.</p>
</section>
<section id="signed-in" hidden><h2>내 정보</h2><p id="profile"></p>
<form id="profile-form"><label>표시 이름<input name="displayName" required maxlength="50" autocomplete="nickname"></label><button>정보 저장</button></form>
<button id="logout" type="button">로그아웃</button>
<h2>비밀번호 변경</h2><p>변경 후 모든 기기에서 다시 로그인해야 합니다.</p>
<form id="password-form"><label>현재 비밀번호<input name="currentPassword" type="password" autocomplete="current-password" required maxlength="128"></label>
<label>변경할 비밀번호<input name="newPassword" type="password" autocomplete="new-password" required minlength="12" maxlength="128"></label><button>비밀번호 변경</button></form>
<details><summary>회원 탈퇴</summary><p>계정이 삭제되며 복구할 수 없습니다. 공개 게시글·댓글·리뷰는 작성자가 ‘탈퇴 회원’으로 표시되어 남습니다. 본인이 작성한 문의는 공개 여부와 관계없이 답변·첨부파일과 함께 삭제됩니다. 그 외 삭제할 글은 탈퇴 전에 직접 삭제해주세요.</p>
<form id="delete-form"><label>탈퇴 확인용 비밀번호<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label><label><input name="confirmed" type="checkbox" required>계정 삭제에 동의합니다.</label><button>내 계정 삭제</button></form></details>
</section></main></body></html>
