name: .NET migration checks
on:
  push:
    paths: ['dotnet/**', 'Dockerfile', '.dockerignore', '.github/workflows/dotnet.yml']
  pull_request:
    paths: ['dotnet/**', 'Dockerfile', '.dockerignore', '.github/workflows/dotnet.yml']
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project dotnet/MedicalInfo.Checks --configuration Release
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t medicalinfo:ci .
      - name: Smoke test container and Compose configuration
        shell: bash
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker run -d --name medicalinfo-check -p 127.0.0.1:8080:8080 --read-only --tmpfs /tmp --cap-drop ALL medicalinfo:ci
          trap 'docker logs medicalinfo-check; docker rm -f medicalinfo-check' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health/live; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/ | grep 'Dr.Geo'
          docker exec medicalinfo-check dotnet MedicalInfo.Web.dll --health-check
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/health/ready)" = 503
