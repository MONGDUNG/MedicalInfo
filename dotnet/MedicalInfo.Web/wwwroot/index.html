<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dr.Geo 병원 검색</title><link rel="stylesheet" href="/site.css"><script src="/search.js" defer></script></head>
<body><main>
<header><p>Dr.Geo</p><h1>병원·약국 찾기</h1><p>지역, 병원 이름 또는 진료과로 검색하세요.</p></header>
<form id="search"><label for="keyword">검색어</label><div class="search"><input id="keyword" name="keyword" required maxlength="100" placeholder="예: 서울 내과" autocomplete="off"><button type="submit">검색</button></div></form>
<p id="status" role="status" aria-live="polite">검색어를 입력해주세요.</p>
<ul id="results" aria-label="검색 결과"></ul>
</main></body></html>
