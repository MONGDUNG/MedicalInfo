<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>문의·답변 · Dr.Geo</title><link rel="stylesheet" href="/site.css"><script src="/attachments.js" defer></script><script src="/inquiries.js" defer></script></head>
<body><main><nav><a href="/">병원·약국 찾기</a><a href="/account.html">회원 계정</a><a href="/community.html">게시판</a></nav><h1>문의·답변</h1><p>비공개 문의는 작성자와 관리자만 열람·답변할 수 있습니다. 공개 문의에는 로그인한 회원이 답변할 수 있습니다. 회원 탈퇴 시 본인이 작성한 문의와 그 답변·첨부파일이 모두 삭제됩니다.</p><p id="status" role="status"></p>
<form id="filter"><label>문의·답변 검색<input name="keyword" maxlength="100"></label><button>검색</button></form><ul id="items"></ul><button id="previous" type="button">이전</button><span id="page"></span><button id="next" type="button">다음</button>
<section id="detail" hidden><h2 id="title"></h2><p id="meta"></p><p id="content" class="drug-text"></p><div id="actions"></div><div id="attachments"></div><h3>답변</h3><ul id="answers"></ul><button id="more" type="button" hidden>답변 더 보기</button><form id="answer-form"><label>답변 내용<textarea name="content" maxlength="4000" required rows="4"></textarea></label><button>답변 저장</button><button id="cancel-answer" type="button">수정 취소</button></form></section>
<h2 id="editor-title">새 문의 작성</h2><p>먼저 글을 저장한 다음 상세 화면에서 이미지를 첨부해주세요.</p><form id="editor"><label>공개 범위<select name="visibility"><option value="PRIVATE">비공개</option><option value="PUBLIC">공개</option></select></label><label>제목<input name="title" maxlength="200" required></label><label>내용<textarea name="content" maxlength="4000" required rows="8"></textarea></label><button>문의 저장</button><button id="cancel" type="button">수정 취소</button></form></main></body></html>
