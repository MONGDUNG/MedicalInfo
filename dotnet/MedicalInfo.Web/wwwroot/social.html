<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>소셜 계정 확인 · Dr.Geo</title><link rel="stylesheet" href="/site.css"><script src="/social.js" defer></script></head><body><main>
<nav><a href="/">병원·약국 찾기</a><a href="/account.html">회원 계정</a></nav><h1>소셜 계정 확인</h1><p id="status" role="status">인증 결과를 확인하는 중입니다.</p>
<section id="pending" hidden><p id="provider"></p><p>아래 버튼으로 확인을 마무리하세요.</p><button id="complete" type="button">로그인·계정 연결 완료</button>
<details id="new-member"><summary>처음 이용한다면 회원가입</summary><p>복구와 계정 관리를 위한 아이디·이메일·비밀번호를 정해주세요. 기존 회원이라면 회원 계정 화면에서 로그인한 뒤 소셜 계정을 연결하세요. 같은 이메일로 계정을 자동 연결하지 않습니다.</p>
<form id="registration"><label>아이디<input name="username" required minlength="3" maxlength="40" pattern="[a-zA-Z0-9._\-]+" autocomplete="username"></label>
<label>표시 이름<input name="displayName" required maxlength="50" autocomplete="nickname"></label><label>이메일<input name="email" required type="email" maxlength="254" autocomplete="email"></label>
<label>비밀번호 (12~128자)<input name="password" type="password" required minlength="12" maxlength="128" autocomplete="new-password"></label><label>비밀번호 확인<input name="confirmation" type="password" required minlength="12" maxlength="128" autocomplete="new-password"></label><button>가입하고 소셜 계정 연결</button></form></details></section>
</main></body></html>
