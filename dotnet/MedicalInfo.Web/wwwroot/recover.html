<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>계정 복구 · Dr.Geo</title><link rel="stylesheet" href="/site.css"><script src="/recover.js" defer></script></head><body><main><nav><a href="/account.html">회원 계정</a><a href="/">병원·약국 찾기</a></nav><h1>이메일 인증·계정 복구</h1><p id="status" role="status"></p>
<section id="request-section"><p>아이디 찾기와 비밀번호 복구는 인증된 이메일로만 가능합니다. 이메일이 미인증 상태라면 먼저 인증 메일을 요청해주세요. 메일이 오지 않으면 스팸함을 확인하고 1분 뒤 다시 요청해주세요.</p><form id="request"><label>요청 종류<select name="purpose"><option value="confirm">이메일 인증</option><option value="username">아이디 찾기</option><option value="reset">비밀번호 재설정</option></select></label><label>가입한 이메일<input name="email" type="email" maxlength="254" required autocomplete="email"></label><button>메일 요청</button></form></section>
<section id="redeem-section" hidden><h2 id="action-title"></h2><p>본인이 요청한 메일인지 확인한 후 아래 버튼을 눌러주세요. 링크는 발급 후 30분 동안 한 번만 사용할 수 있습니다.</p><form id="redeem"><div id="password-fields" hidden><label>새 비밀번호<input name="newPassword" type="password" minlength="12" maxlength="128" autocomplete="new-password"></label><label>비밀번호 확인<input name="confirmation" type="password" minlength="12" maxlength="128" autocomplete="new-password"></label></div><button>확인</button></form><p id="result" role="status"></p></section></main></body></html>
