name: .NET migration checks
on:
  push:
    paths: ['dotnet/**', 'Dockerfile', '.dockerignore', '.github/workflows/dotnet.yml']
  pull_request:
    paths: ['dotnet/**', 'Dockerfile', '.dockerignore', '.github/workflows/dotnet.yml']
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project dotnet/MedicalInfo.Checks --configuration Release
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t medicalinfo:ci .
