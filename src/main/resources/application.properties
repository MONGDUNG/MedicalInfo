spring.application.name=global

#Database - h2
spring.h2.console.enabled=true
spring.h2.console.path=/h2
spring.datasource.url=jdbc:h2:tcp://localhost/~/global
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

#JPA
spring.jpa.properties.hibernate.dealect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.show_sql=false

#Elasitcsearch
spring.elasticsearch.uris=http://localhost:9200
spring.data.elasticsearch.repositories.enabled=true
spring.elasticsearch.connection-timeout=5s
spring.elasticsearch.socket-timeout=5s

#Tomcat header size
server.max-http-request-header-size=64KB


# Mail
spring.mail.host=smtp.naver.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# REST API KEY for kakao
KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID:}
KAKAO_SERVER_REDIRECT_URI=http://localhost:8080/login/kakao/callback

spring.security.user.name=${BOOTSTRAP_ADMIN_USERNAME:}
spring.security.user.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# Client application settings(naver)
naver.client.id=${NAVER_CLIENT_ID:}
naver.client.secret=${NAVER_CLIENT_SECRET:}
naver.redirect.url=http://localhost:8080/naver/callback

#image
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB


